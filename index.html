<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Симулятор Камня</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #000; }
    #loginForm { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(44,62,80,0.9); padding: 40px; border-radius: 16px; color: white; z-index: 100; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.4); backdrop-filter: blur(10px); }
    #loginForm input { padding: 12px; font-size: 16px; border-radius: 8px; border: 1px solid #555; margin: 15px 10px 0 0; width: 200px; background: rgba(255,255,255,0.1); color: white; }
    #loginForm button { padding: 12px 24px; font-size: 16px; background: #27ae60; color: white; border: none; border-radius: 8px; cursor: pointer; margin: 5px; }
    #loginForm button:hover { background: #2ecc71; }
    #leaderboardBtn { background: #3498db; } #leaderboardBtn:hover { background: #5dade2; }
    #timer { position: fixed; top: 20px; right: 20px; color: white; font-size: 20px; font-weight: bold; background: rgba(0,0,0,0.6); padding: 12px 24px; border-radius: 8px; display: none; z-index: 50; }
    #clock { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); color: white; font-size: 15px; background: rgba(0,0,0,0.5); padding: 8px 16px; border-radius: 8px; display: none; z-index: 50; }
    #idleHint { position: fixed; bottom: 20px; right: 20px; color: rgba(255,255,255,0.7); font-size: 14px; background: rgba(0,0,0,0.4); padding: 8px 16px; border-radius: 8px; display: none; z-index: 50; }
    #biomeBar { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); display: none; gap: 8px; z-index: 50; }
    #biomeBar button { padding: 8px 16px; font-size: 14px; border: 1px solid rgba(255,255,255,0.3); background: rgba(0,0,0,0.5); color: white; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    #biomeBar button.active { background: #27ae60; border-color: #27ae60; font-weight: bold; }
    #leaderboardModal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; display: none; justify-content: center; align-items: center; }
    #leaderboardContent { background: rgba(20,30,48,0.95); color: white; border-radius: 12px; padding: 24px; min-width: 320px; backdrop-filter: blur(10px); }
    #leaderboardContent h3 { margin: 0 0 15px 0; font-size: 20px; color: #f1c40f; }
    #leaderboardContent table { width: 100%; border-collapse: collapse; font-size: 16px; }
    #leaderboardContent td { padding: 8px 6px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    #leaderboardContent .me { background: rgba(39,174,96,0.4); border-radius: 6px; }
    #leaderboardContent .rank { color: #95a5a6; width: 30px; }
    #leaderboardContent .time { text-align: right; color: #bdc3c7; }
    #closeLeaderboard { margin-top: 15px; padding: 10px 20px; background: #e74c3c; color: white; border: none; border-radius: 6px; cursor: pointer; }
    #exitBtn { position: fixed; top: 20px; left: 20px; padding: 12px 24px; font-size: 16px; background: #e74c3c; color: white; border: none; border-radius: 8px; cursor: pointer; z-index: 50; display: none; }
    #loading { position: fixed; inset: 0; background: #0b1220; color: #cfe3ff; display: none; justify-content: center; align-items: center; font-size: 20px; z-index: 300; }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="loginForm">
    <h2>Симулятор Камня</h2>
    <input type="text" id="username" placeholder="Твоё имя">
    <button id="startBtn">Начать игру</button>
    <button id="leaderboardBtn">Таблица лидеров</button>
  </div>
  <div id="leaderboardModal"><div id="leaderboardContent"><h3>Таблица лидеров (топ-10)</h3><table id="lbTable"></table><button id="closeLeaderboard">Закрыть</button></div></div>
  <div id="timer">Время сессии: <span id="timeValue">0</span> сек</div>
  <div id="clock">☀️ День</div>
  <div id="idleHint">📷 Камера крутится сама — тронь мышь</div>
  <div id="biomeBar">
    <button data-b="forest" class="active">🌲 Лес</button>
    <button data-b="winter">❄️ Зима</button>
    <button data-b="beach">🏖️ Пляж</button>
    <button data-b="desert">🏜️ Пустыня</button>
  </div>
  <button id="exitBtn">🚪 Выйти и сохранить</button>
  <div id="loading">Строим мир…</div>
  <canvas id="cv"></canvas>

  <script type="importmap">
  { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    // ====================== БАЗА ДАННЫХ / UI (без изменений) ======================
    const SUPABASE_URL = 'https://jndlzfteecpcguqxqpwd.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_44I121BlKsABcW2sep0gIQ_Lkt3X6_m'.trim();
    let supabase = null;
    function withTimeout(p, ms = 8000) { return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]); }
    const dbReadyPromise = (async () => {
      try {
        const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
        supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
        const { error } = await withTimeout(supabase.from('players').select('id').limit(1));
        if (error) throw error;
        console.log('✅ БД подключена');
      } catch (e) { console.warn('❌ БД недоступна:', e.message); supabase = null; }
    })();

    let playerId = null, baseTime = 0, sessionTime = 0, timerInterval = null;
    const $ = id => document.getElementById(id);
    const loginForm = $('loginForm'), startBtn = $('startBtn'), leaderboardBtn = $('leaderboardBtn');
    const usernameInput = $('username'), timerDiv = $('timer'), timeValue = $('timeValue'), exitBtn = $('exitBtn');
    const idleHint = $('idleHint'), clock = $('clock'), biomeBar = $('biomeBar'), loadingEl = $('loading');
    const leaderboardModal = $('leaderboardModal'), closeLeaderboard = $('closeLeaderboard'), lbTable = $('lbTable');

    async function refreshLeaderboard() {
      let players = [];
      if (supabase) { try { const { data } = await supabase.from('players').select('id, username, playtime').order('playtime', { ascending: false }).limit(10); if (data) players = data; } catch (e) {} }
      if (!players.length) players = JSON.parse(localStorage.getItem('rockPlayers') || '[]').sort((a, b) => b.playtime - a.playtime).slice(0, 10);
      lbTable.innerHTML = players.map((p, i) => `<tr class="${p.id === playerId ? 'me' : ''}"><td class="rank">${i + 1}</td><td>${p.username}</td><td class="time">${p.playtime} с</td></tr>`).join('') || '<tr><td colspan="3">Пока пусто</td></tr>';
    }
    leaderboardBtn.addEventListener('click', () => { refreshLeaderboard(); leaderboardModal.style.display = 'flex'; });
    closeLeaderboard.addEventListener('click', () => leaderboardModal.style.display = 'none');

    async function savePlaytime() {
      const total = baseTime + sessionTime, name = usernameInput._name;
      if (supabase && name) {
        try {
          const { data: ex } = await withTimeout(supabase.from('players').select('id').eq('username', name).maybeSingle());
          if (ex) await withTimeout(supabase.from('players').update({ playtime: total }).eq('id', ex.id));
          else await withTimeout(supabase.from('players').insert([{ username: name, playtime: total }]));
          console.log('✅ Сохранено в БД:', total); return;
        } catch (e) { console.warn('❌ БД ошибка:', e.message); }
      }
      const players = JSON.parse(localStorage.getItem('rockPlayers') || '[]');
      const p = players.find(x => x.username === name);
      if (p) p.playtime = total; else players.push({ id: Date.now(), username: name, playtime: total });
      localStorage.setItem('rockPlayers', JSON.stringify(players));
    }

    startBtn.addEventListener('click', async () => {
      const username = usernameInput.value.trim(); if (!username) return alert('Введи имя!');
      usernameInput._name = username;
      await dbReadyPromise;
      if (supabase) { try { const { data: existing } = await withTimeout(supabase.from('players').select('id, playtime').eq('username', username).maybeSingle()); baseTime = existing ? (existing.playtime || 0) : 0; } catch (e) { supabase = null; baseTime = 0; } }
      if (!supabase) { const players = JSON.parse(localStorage.getItem('rockPlayers') || '[]'); baseTime = (players.find(x => x.username === username) || {}).playtime || 0; }
      sessionTime = 0;
      loginForm.style.display = 'none'; timerDiv.style.display = 'block'; exitBtn.style.display = 'block';
      clock.style.display = 'block'; biomeBar.style.display = 'flex'; timeValue.textContent = 0;
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => { sessionTime++; timeValue.textContent = sessionTime; if (sessionTime % 5 === 0) savePlaytime(); }, 1000);
    });

    exitBtn.addEventListener('click', async () => {
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
      await savePlaytime();
      baseTime = 0; sessionTime = 0; usernameInput.value = '';
      loginForm.style.display = 'block'; timerDiv.style.display = 'none'; exitBtn.style.display = 'none';
      clock.style.display = 'none'; biomeBar.style.display = 'none';
    });

    // ====================== МАТЕМАТИКА / ШУМ ======================
    const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
    const smooth = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };
    const lerp = (a, b, t) => a + (b - a) * t;
    function hash(x, z) { const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); }
    function vnoise(x, z) {
      const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
      const u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
      const a = hash(xi, zi), b = hash(xi + 1, zi), c = hash(xi, zi + 1), d = hash(xi + 1, zi + 1);
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    }
    function fbm(x, z, o = 4) { let s = 0, a = 0.5, f = 1; for (let i = 0; i < o; i++) { s += a * vnoise(x * f, z * f); f *= 2.03; a *= 0.5; } return s; }
    function ridged(x, z, o = 5) { let s = 0, a = 0.5, f = 1, w = 1; for (let i = 0; i < o; i++) { let n = 1 - Math.abs(vnoise(x * f, z * f) * 2 - 1); n *= n; s += n * a * w; w = clamp01(n * 2); f *= 2.1; a *= 0.5; } return s; }
    function hash3(x, y, z) { const s = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453; return s - Math.floor(s); }
    function noise3(x, y, z) {
      const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z), xf = x - xi, yf = y - yi, zf = z - zi;
      const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
      return lerp(
        lerp(lerp(hash3(xi, yi, zi), hash3(xi + 1, yi, zi), u), lerp(hash3(xi, yi + 1, zi), hash3(xi + 1, yi + 1, zi), u), v),
        lerp(lerp(hash3(xi, yi, zi + 1), hash3(xi + 1, yi, zi + 1), u), lerp(hash3(xi, yi + 1, zi + 1), hash3(xi + 1, yi + 1, zi + 1), u), v), w);
    }

    // ====================== СЦЕНА / ОСВЕЩЕНИЕ / НЕБО ======================
    const cv = $('cv');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 1200);
    camera.position.set(0, 6, 14);
    const renderer = new THREE.WebGLRenderer({ antialias: true, canvas: cv });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    scene.fog = new THREE.Fog(0xbfe3f5, 60, 290);

        // ===== BLOOM ПОСТ-ОБРАБОТКА =====
    const composer = new EffectComposer(renderer);
    const renderPass = new RenderPass(scene, camera);
    composer.addPass(renderPass);

    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(innerWidth, innerHeight),
      0.8,    // strength — сила свечения (0.5-1.5)
      0.4,    // radius — радиус размытия (0.3-0.8)
      0.85    // threshold — порог яркости (0.7-0.9, чтобы не всё светилось)
    );
    composer.addPass(bloomPass);

    const hemi = new THREE.HemisphereLight(0xbfe3f5, 0x558B2F, 0.6); scene.add(hemi);
    const ambient = new THREE.AmbientLight(0xffffff, 0.15); scene.add(ambient);
    const sunLight = new THREE.DirectionalLight(0xffffff, 1.6);
    sunLight.castShadow = true;
    Object.assign(sunLight.shadow.camera, { left: -45, right: 45, top: 45, bottom: -45, near: 1, far: 260 });
    sunLight.shadow.mapSize.set(2048, 2048); sunLight.shadow.bias = -0.0004; sunLight.shadow.normalBias = 0.04;
    scene.add(sunLight);
    const moonLight = new THREE.DirectionalLight(0x9fb4ff, 0); scene.add(moonLight);

    const skyGroup = new THREE.Group(); scene.add(skyGroup);
    const skyU = {
      top: { value: new THREE.Color('#3f8fe0') }, hor: { value: new THREE.Color('#bfe3f5') },
      sunDir: { value: new THREE.Vector3(0, 1, 0) }, sunCol: { value: new THREE.Color(1, 1, 1) }, glowI: { value: 1 }
    };
    const skyMat = new THREE.ShaderMaterial({
      side: THREE.BackSide, depthWrite: false, fog: false, uniforms: skyU,
      vertexShader: 'varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
      fragmentShader: `uniform vec3 top; uniform vec3 hor; uniform vec3 sunDir; uniform vec3 sunCol; uniform float glowI; varying vec3 vDir;
        void main(){
          vec3 d = normalize(vDir);
          float h = clamp(d.y, 0.0, 1.0);
          vec3 col = mix(hor, top, pow(h, 0.5));
          float s = max(dot(d, sunDir), 0.0);
          col += sunCol * (pow(s, 6.0) * 0.22 + pow(s, 48.0) * 0.35) * glowI;
          gl_FragColor = vec4(col, 1.0);
          #include <tonemapping_fragment>
          #include <colorspace_fragment>
        }`
    });
    const skyDome = new THREE.Mesh(new THREE.SphereGeometry(700, 32, 16), skyMat); skyDome.renderOrder = -10; skyDome.frustumCulled = false; skyGroup.add(skyDome);
    const sunBall = new THREE.Mesh(new THREE.SphereGeometry(16, 20, 14), new THREE.MeshBasicMaterial({ fog: false, toneMapped: false })); skyGroup.add(sunBall);
    const moonBall = new THREE.Mesh(new THREE.SphereGeometry(11, 20, 14), new THREE.MeshBasicMaterial({ color: 0xe6ecff, fog: false, toneMapped: false })); skyGroup.add(moonBall);
    const starGeo = new THREE.BufferGeometry();
    { const arr = []; for (let i = 0; i < 1800; i++) { const a = Math.random() * 6.2832, y = 0.02 + Math.random() * 0.98, r = 600, q = Math.sqrt(1 - y * y); arr.push(Math.cos(a) * q * r, y * r, Math.sin(a) * q * r); } starGeo.setAttribute('position', new THREE.Float32BufferAttribute(arr, 3)); }
    const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 1.8, sizeAttenuation: false, transparent: true, opacity: 0, fog: false, depthWrite: false }));
    skyGroup.add(stars);

    const dayTop = new THREE.Color(), dayHor = new THREE.Color();
    const nightTop = new THREE.Color('#040816'), nightHor = new THREE.Color('#0b1428');
    const sunsetTop = new THREE.Color('#6a5a9a'), sunsetHor = new THREE.Color('#ff9a5a');
    const tmpTop = new THREE.Color(), tmpHor = new THREE.Color(), sunC = new THREE.Color(), orange = new THREE.Color('#ff7a30');

    // ====================== БИОМЫ ======================
    const LAKE = { x: 26, z: -18, r: 11 };
    const BIOMES = {
      forest: { sky: ['#3f8fe0', '#bfe3f5'], fog: [60, 290], sun: 0xfff1d8, sunI: 1.7, amb: 0.18, hemi: 0.6,
        ground: { dark: 0x3f7a2a, light: 0x8fc652, dirt: 0x7a5c44, alpine: 0x7d8a5a }, rock: 0x7b7d80, snowLine: 42,
        height: 1, mtnH: 100, mtnBase: 12, mtnStart: 60, water: 0x2a7fc0, frozen: false, trees: 'forest', treeN: 110,
        grass: { n: 9000, h: [0.22, 0.31], s: [0.5, 0.8], l: [0.26, 0.46] }, flowers: 800, mushrooms: 26, logs: 6, bushes: 55, bushCol: 0x3f7d2c, berries: true, boulders: 14,
        far: 'forest', birdCol: 0x2b2b2b, butterflies: 26, fireflies: true,
        animals: [['rabbit', 9, false], ['deer', 4, true], ['dog', 3, true]], particles: null },
      winter: { sky: ['#7f9fc9', '#e3edf8'], fog: [50, 230], sun: 0xe9f2ff, sunI: 1.5, amb: 0.22, hemi: 0.75,
        ground: { dark: 0xcfdbe8, light: 0xf4f9ff, dirt: 0xb8c6d6, alpine: 0xe8f0f8 }, rock: 0x8a95a3, snowLine: -5,
        height: 0.8, mtnH: 100, mtnBase: 12, mtnStart: 60, water: 0x8fcfff, frozen: true, trees: 'winter', treeN: 75,
        grass: { n: 2200, h: [0.52, 0.6], s: [0.1, 0.3], l: [0.82, 0.95] }, flowers: 0, mushrooms: 0, logs: 4, bushes: 25, bushCol: 0x9fb8a8, berries: false, boulders: 14,
        far: 'winter', birdCol: 0x222222, butterflies: 0, fireflies: false,
        animals: [['penguin', 9, false], ['deer', 4, true]], particles: 'snow' },
      beach: { sky: ['#2b9ae0', '#cdeefa'], fog: [70, 320], sun: 0xfff3d0, sunI: 1.9, amb: 0.2, hemi: 0.65,
        ground: { dark: 0xdcc080, light: 0xf2e0a8, dirt: 0xb59658, alpine: 0xcdb078 }, rock: 0x9b8f7c, snowLine: 9999,
        height: 0.5, dune: 0.5, mtnH: 28, mtnBase: 6, mtnStart: 75, water: 0x18a9e0, frozen: false, sea: true, trees: 'beach', treeN: 28,
        grass: { n: 2600, h: [0.14, 0.19], s: [0.4, 0.7], l: [0.4, 0.6] }, flowers: 0, mushrooms: 0, logs: 4, bushes: 12, bushCol: 0x5f8f3a, berries: false, boulders: 8,
        far: null, birdCol: 0xf2f2f2, butterflies: 10, fireflies: false,
        animals: [['crab', 12, false], ['seal', 3, true]], particles: null },
      desert: { sky: ['#5a9ad0', '#ffe3b0'], fog: [70, 300], sun: 0xffe0a8, sunI: 1.9, amb: 0.2, hemi: 0.6,
        ground: { dark: 0xc2884a, light: 0xe9c98a, dirt: 0xa06a30, alpine: 0xb27840 }, rock: 0x9a6a46, snowLine: 9999,
        height: 1.6, dune: 1.6, mtnH: 60, mtnBase: 10, mtnStart: 70, water: 0x26c6da, frozen: false, trees: 'desert', treeN: 32,
        grass: { n: 800, h: [0.09, 0.12], s: [0.4, 0.55], l: [0.45, 0.62] }, flowers: 0, mushrooms: 0, logs: 0, bushes: 20, bushCol: 0x8a7d3c, berries: false, boulders: 26,
        far: null, birdCol: 0x1a1a1a, butterflies: 8, fireflies: false,
        animals: [['lizard', 8, false], ['camel', 3, true]], particles: 'dust' },
    };
    let biome = 'forest';

    // ====================== РЕЛЬЕФ ======================
    function heightAt(x, z) {
      const b = BIOMES[biome], d = Math.hypot(x, z);
      const flat = smooth(8, 20, d);
      let h = flat * b.height * ((fbm(x * 0.028 + 11, z * 0.028 - 5, 4) - 0.47) * 9 + (fbm(x * 0.11, z * 0.11, 3) - 0.47) * 1.4);
      const sea = b.sea ? smooth(36, 70, x) : 0;
      const mm = smooth(b.mtnStart, b.mtnStart + 70, d) * (1 - sea);
      if (mm > 0.001) h += mm * (b.mtnBase + ridged(x * 0.011 + 3.7, z * 0.011 - 7.1, 5) * b.mtnH + fbm(x * 0.03, z * 0.03, 3) * b.mtnH * 0.12);
      if (b.dune) h += flat * b.dune * (Math.sin(x * 0.045 + fbm(x * 0.03, z * 0.03, 3) * 7) * 0.5 + Math.sin(z * 0.06 + x * 0.02) * 0.3);
      if (b.sea) { h = Math.max(h, 0.15); h = h * (1 - sea) + (-4.2) * sea; }
      else {
        const dl = Math.hypot(x - LAKE.x, z - LAKE.z);
        h *= smooth(LAKE.r + 1, LAKE.r + 12, dl);
        h -= 3.4 * (1 - smooth(0, LAKE.r, dl));
      }
      return h;
    }
    function slopeAt(x, z) { const e = 1.5; return Math.hypot(heightAt(x + e, z) - heightAt(x - e, z), heightAt(x, z + e) - heightAt(x, z - e)) / (2 * e); }
    function inLake(x, z, pad) { return !BIOMES[biome].sea && Math.hypot(x - LAKE.x, z - LAKE.z) < LAKE.r + pad; }
    function isSea(x) { return BIOMES[biome].sea && x > 40; }

    let world = new THREE.Group(); scene.add(world);
    let waterMesh = null, particleSystem = null;
    let trees = [], clouds = [], animals = [], fireflies = [], butterflies = [], birds = [], treePts = [];
    const windU = { value: 0 };
    const M = (c) => new THREE.MeshStandardMaterial({ color: c, flatShading: true });
    const MS = (c) => new THREE.MeshStandardMaterial({ color: c });
    const rnd = (a, b) => a + Math.random() * (b - a);

    function blocked(x, z, r) { for (const o of treePts) { const dx = x - o.x, dz = z - o.z, rr = r + o.r; if (dx * dx + dz * dz < rr * rr) return true; } return false; }
    function sample(minD, maxD, cond, tries = 30) {
      for (let k = 0; k < tries; k++) {
        const a = Math.random() * 6.2832, d = minD + Math.random() * (maxD - minD);
        const x = Math.cos(a) * d, z = Math.sin(a) * d;

      const geo = new THREE.ConeGeometry(0.05, 0.65, 3, 1); geo.translate(0, 0.325, 0);
      const mat = new THREE.MeshStandardMaterial({ roughness: 1, flatShading: true });
      mat.onBeforeCompile = sh => {
        sh.uniforms.uTime = windU;
        sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nuniform float uTime;')
          .replace('#include <begin_vertex>', '#include <begin_vertex>\n float ph = uTime * 1.8 + instanceMatrix[3].x * 0.35 + instanceMatrix[3].z * 0.27; transformed.x += sin(ph) * 0.12 * position.y; transformed.z += cos(ph * 0.8) * 0.08 * position.y;');
      };
      const mesh = new THREE.InstancedMesh(geo, mat, G.n), dm = new THREE.Object3D(), c = new THREE.Color();
      let k = 0, guard = 0;
      while (k < G.n && guard++ < G.n * 3) {
        const a = Math.random() * 6.2832, d = 1.6 + Math.pow(Math.random(), 0.8) * 95;
        const x = Math.cos(a) * d, z = Math.sin(a) * d;
        if (inLake(x, z, 0.5) || isSea(x)) continue;
        const y = heightAt(x, z); if (y < -0.5 || y > 26) continue;
        if (d > 55 && slopeAt(x, z) > 0.8) continue;
        dm.position.set(x, y - 0.02, z); dm.rotation.set((Math.random() - .5) * 0.4, Math.random() * 6.28, (Math.random() - .5) * 0.4); dm.scale.setScalar(rnd(0.6, 1.6)); dm.updateMatrix();
        mesh.setMatrixAt(k, dm.matrix);
        const patch = fbm(x * 0.1, z * 0.1, 2);
        c.setHSL(rnd(G.h[0], G.h[1]), rnd(G.s[0], G.s[1]), Math.min(0.97, rnd(G.l[0], G.l[1]) + (patch - 0.45) * 0.2));
        mesh.setColorAt(k, c); k++;
      }
      mesh.count = k; mesh.instanceMatrix.needsUpdate = true; if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true; mesh.frustumCulled = false;
      world.add(mesh);
    }

    function buildFlowers(n) {
      const stemG = new THREE.CylinderGeometry(0.012, 0.016, 0.4, 4); stemG.translate(0, 0.2, 0);
      const headG = new THREE.CylinderGeometry(0.1, 0.03, 0.06, 7, 1, true); headG.translate(0, 0.41, 0);

      const pal = [[0.95, 0.8, 0.7], [0.13, 0.95, 0.6], [0, 0, 0.97], [0.75, 0.6, 0.72], [0.6, 0.8, 0.72], [0.02, 0.9, 0.6]];

      while (k < n && guard++ < n * 8) {

        if (inLake(x, z, 1) || isSea(x)) continue;

        const y = heightAt(x, z); if (y < -0.4 || slopeAt(x, z) > 0.7) continue;
        dm.position.set(x, y - 0.01, z); dm.rotation.set(0, Math.random() * 6.28, 0); dm.scale.setScalar(rnd(0.8, 1.5)); dm.updateMatrix();
        stems.setMatrixAt(k, dm.matrix); heads.setMatrixAt(k, dm.matrix); cens.setMatrixAt(k, dm.matrix);
        const pc = pal[Math.floor(vnoise(x * 0.06 + 9, z * 0.06 - 4) * 6) % 6]; c.setHSL(pc[0], pc[1], pc[2]); heads.setColorAt(k, c); k++;
      }

    function buildFarForest() {

      const geo = new THREE.ConeGeometry(1.4, 6.5, 6); geo.translate(0, 3.25, 0);

      while (k < n && guard++ < n * 4) {

        dm.position.set(x, y - 0.3, z); dm.rotation.y = Math.random() * 6; dm.scale.set(rnd(0.8, 2.2), rnd(0.9, 2.4), rnd(0.8, 2.2)); dm.updateMatrix(); mesh.setMatrixAt(k, dm.matrix);

          dm.position.set(x, y - 0.2, z); dm.rotation.y = Math.random() * 6; dm.scale.set(rnd(0.8, 1.6), rnd(0.9, 1.5), rnd(0.8, 1.6)); dm.updateMatrix(); bm.setMatrixAt(q, dm.matrix);

        bm.count = q; bm.instanceMatrix.needsUpdate = true; if (bm.instanceColor) bm.instanceColor.needsUpdate = true; bm.frustumCulled = false; world.add(bm);
      }
    }

      moonLight.position.copy(sd).multiplyScalar(-90); moonLight.intensity = 0.35 * (1 - dayF);
      hemi.color.copy(tmpTop).lerp(new THREE.Color(0xffffff), 0.35); hemi.intensity = b.hemi * (0.28 + 0.72 * dayF);
      ambient.intensity = b.amb * (0.5 + 0.5 * dayF);
      skyGroup.position.copy(camera.position);
      sunBall.position.copy(sd).multiplyScalar(380); sunBall.material.color.copy(sunC).multiplyScalar(1.4); sunBall.visible = sunY > -0.12;
      moonBall.position.copy(sd).multiplyScalar(-380); moonBall.visible = -sunY > -0.12;
      stars.material.opacity = Math.max(0, 1 - dayF * 1.4); stars.visible = stars.material.opacity > 0.01; stars.rotation.y = t * 0.004;
      clock.textContent = dayF < 0.15 ? '🌙 Ночь' : (sunsetF > 0.35 ? '🌅 Закат/рассвет' : '☀️ День');

      const idle = performance.now() - lastInteract > 3000;
      controls.autoRotate = idle;
      idleHint.style.display = (idle && loginForm.style.display === 'none') ? 'block' : 'none';

      // --- мир ---
      waterTex.offset.set(t * 0.012, t * 0.007);
      clouds.forEach(c => { c.position.x += c.userData.speed * dt; if (c.position.x > 320) c.position.x = -320; });
      trees.forEach(tr => { const w = Math.sin(t * 1.2 + tr.userData.phase) * 0.018; tr.rotation.z = w; tr.rotation.x = Math.cos(t * 0.9 + tr.userData.phase) * 0.012; });
      fireflies.forEach(f => { const on = dayF < 0.3; f.visible = on; if (on) { f.position.y = f.userData.base.y + Math.sin(t * 2 + f.userData.ph) * 0.5; f.position.x = f.userData.base.x + Math.sin(t * 0.7 + f.userData.ph) * 0.8; f.material.opacity = 0.5 + 0.5 * Math.sin(t * 4 + f.userData.ph); } });
      if (particleSystem) {
        const pp = particleSystem.geometry.attributes.position, snow = b.particles === 'snow';
        for (let i = 0; i < pp.count; i++) {
          let y = pp.getY(i) + (snow ? -2 : -0.3) * dt, x = pp.getX(i);
          if (snow) x += Math.sin(t + i) * 0.3 * dt; else x += 3 * dt;
          if (y < 0) y = 60; if (x > 70) x = -70;
          pp.setXYZ(i, x, y, pp.getZ(i));
        }
        pp.needsUpdate = true;
      }
      butterflies.forEach(bf => {
        const u = bf.userData, ph = t * u.s + u.ph;
        const x = u.cx + Math.sin(ph) * u.r1, z = u.cz + Math.cos(ph * 0.8 + u.ph) * u.r2;
        const dx = Math.cos(ph) * u.r1 * u.s, dz = -Math.sin(ph * 0.8 + u.ph) * u.r2 * u.s * 0.8;
        bf.position.set(x, Math.max(heightAt(x, z), -0.5) + u.h + Math.sin(t * 2 + u.ph) * 0.4, z);
        bf.rotation.y = Math.atan2(dx, dz);
        const flap = 0.2 + Math.abs(Math.sin(t * 14 + u.ph)) * 0.9; u.wl.rotation.z = -flap; u.wr.rotation.z = flap;
      });
      birds.forEach(bd => {
        const f = bd.userData.f; f.a += f.sp * dt;
        bd.position.set(f.cx + Math.cos(f.a) * f.r, f.y + Math.sin(t * 0.8 + f.ph) * 1.2, f.cz + Math.sin(f.a) * f.r);
        bd.rotation.y = f.sp > 0 ? -f.a : -f.a + Math.PI; bd.rotation.z = 0.15 * Math.sign(f.sp) * -1;
        const flap = Math.sin(t * 7 + f.ph) * 0.55; bd.userData.wl.rotation.z = -flap; bd.userData.wr.rotation.z = flap;
      });
      animals.forEach(an => animateAnimal(an, an.userData, dt, t));

      controls.update();
      const gy = Math.max(heightAt(camera.position.x, camera.position.z), -0.9);
      if (camera.position.y < gy + 1.2) camera.position.y = gy + 1.2;
      composer.render();
    })();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      composer.setSize(innerWidth, innerHeight);
      bloomPass.resolution.set(innerWidth, innerHeight);
    });  </script>
